<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 墨阅 MoRead</title>
  <meta name="description" content="登录或注册墨阅，保存书架、笔记与阅读进度。">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <script>
    try { if (localStorage.getItem("moread.theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}
  </script>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-page="login" data-chrome="none">
  <div class="login-page">
    <section class="login-art" aria-label="墨阅介绍">
      <div class="login-art__brand">
        <span class="rail__seal" style="width:34px;height:34px;font-size:19px">阅</span>
        <span>墨阅 MoRead</span>
      </div>

      <div>
        <p class="login-art__quote">书不会催人，<br>这一点，比很多事都温柔。</p>
        <p class="login-art__by">——《灯下》，墨阅样章</p>
      </div>

      <div class="login-art__figure">
        <img src="assets/img/undraw/reading_6jjr.svg" alt="一个人坐在椅子上读书">
      </div>

      <p class="login-art__foot">一个把找书、读书、记书连在一起的数字书房。<br>插画来自 unDraw，摄影素材来自 Pexels。</p>
    </section>

    <section class="login-form-wrap">
      <div class="login-top">
        <a class="icon-btn" href="index.html" aria-label="返回首页"><iconify-icon icon="ph:arrow-left" aria-hidden="true"></iconify-icon></a>
        <button class="icon-btn" type="button" data-theme-toggle aria-label="切换主题"><iconify-icon icon="ph:moon" aria-hidden="true"></iconify-icon></button>
      </div>

      <div class="login-card">
        <div>
          <p class="kicker">墨阅账号</p>
          <h1 id="authTitle">欢迎回到墨阅</h1>
          <p class="login-card__sub" id="authSub">继续上次的阅读，或者从书架里挑一本新的。</p>
        </div>

        <div class="login-tabs" role="tablist" aria-label="登录或注册">
          <button class="tab is-active" type="button" role="tab" data-auth-tab="login">登录</button>
          <button class="tab" type="button" role="tab" data-auth-tab="register">注册</button>
        </div>

        <form class="login-form" id="authForm" novalidate>
          <div class="field" id="nameField" hidden>
            <label for="authName">昵称</label>
            <input class="input" id="authName" type="text" autocomplete="nickname" placeholder="你希望别人怎么称呼你">
          </div>
          <div class="field">
            <label for="authEmail">邮箱</label>
            <input class="input" id="authEmail" type="email" autocomplete="email" placeholder="name@example.com" value="reader@moread.cn">
          </div>
          <div class="field">
            <label for="authPassword">密码</label>
            <input class="input" id="authPassword" type="password" autocomplete="current-password" placeholder="至少 6 位" value="123456">
          </div>
          <p class="field__error" id="authError" role="alert"></p>
          <button class="btn btn--accent btn--wide" type="submit" id="authSubmit">登录</button>
        </form>

        <div class="login-divider">演示账号</div>
        <div class="demo-accounts">
          <div class="row between wrap gap-6"><span><strong>读者：</strong>reader@moread.cn / 123456</span><button class="btn btn--quiet btn--sm" type="button" data-demo-account="reader">填入</button></div>
          <div class="row between wrap gap-6"><span><strong>管理员：</strong>admin@moread.cn / admin123</span><button class="btn btn--quiet btn--sm" type="button" data-demo-account="admin">填入</button></div>
        </div>

        <a class="btn btn--ghost btn--wide" href="index.html">以游客身份看看</a>

        <p class="login-card__foot">本站为毕业设计静态演示，不收集真实账号信息。登录状态仅保存在本机浏览器。<br>继续即表示你同意 <a href="#">用户协议</a> 与 <a href="#">隐私说明</a>。</p>
      </div>
    </section>
  </div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/vendor/iconify-icon.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
