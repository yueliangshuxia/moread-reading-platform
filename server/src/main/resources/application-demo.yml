# 一键演示模式：内嵌 H2 文件数据库，不需要 MySQL。
# 启动：java -jar moread-server.jar --spring.profiles.active=demo
server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:h2:file:./data/moread;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  sql:
    init:
      mode: never

moread:
  seed:
    enabled: true

logging:
  level:
    root: INFO
    com.moread: INFO
